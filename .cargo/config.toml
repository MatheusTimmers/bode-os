[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
runner = "./run.sh"

[alias]
test-host = "test --lib --target x86_64-unknown-linux-gnu"
build-ibex = "build --release --features ibex"
run-ibex = ["run", "--release", "--features", "ibex", "--config", "target.riscv32imc-unknown-none-elf.runner='./run-ibex.sh'"]
