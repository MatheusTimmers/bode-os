name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - name: Formatacao
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Clippy com testes e medicao
        run: |
          cargo clippy --features hw-test -- -D warnings
          cargo clippy --features bench -- -D warnings
          cargo clippy --features switch-bench -- -D warnings
          cargo clippy --features switch-bench-no-pmp -- -D warnings

      - name: Clippy do Ibex
        run: |
          cargo clippy --release --features ibex -- -D warnings
          cargo clippy --release --features ibex,hw-test -- -D warnings
          cargo clippy --release --features ibex,bench -- -D warnings
          cargo clippy --release --features ibex,switch-bench -- -D warnings
          cargo clippy --release --features ibex,switch-bench-no-pmp -- -D warnings

      - name: Build
        run: cargo build

      - name: Instala as dependencias
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib qemu-system-riscv

      - name: Testes no host
        run: cargo test-host

      - name: Smoke test no QEMU
        run: scripts/smoke.sh
