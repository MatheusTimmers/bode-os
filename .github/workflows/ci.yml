name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - name: Formatacao
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Testes no host
        run: cargo test-host

      - name: Instala o QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc

      - name: Smoke test no QEMU
        run: scripts/smoke.sh
